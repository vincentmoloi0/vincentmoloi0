name: Post to Facebook
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python automation.py
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
